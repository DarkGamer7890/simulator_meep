name: pmp
channels:
  - conda-forge

dependencies:
  - python=3.10

  # Meep with MPI support
  - pymeep=*=mpi_mpich_*

  # Common scientific libs
  - numpy
  - matplotlib
  - plotly
  - h5py

  # MPI runtime (pulled automatically, but explicit is fine)
  - mpich

  # Pip-only packages
  - pip
  - pip:
      # - streamlit
      # - pywebview
      - pyvista
      - pyvistaqt 
      # - pyside6 
      - vtk
      - PyQtWebEngine
